<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CS2 Case Farm</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0b0e12; --panel:#161c25; --border:#2a323d; --text:#e6e9ee;
    --gold:#f5a623; --gold-dim:#c4851a; --green:#4ade80; --red:#f87171;
    --radius:12px; --radius-sm:8px; --shadow:0 10px 30px rgba(0,0,0,.4);
    --transition:.2s cubic-bezier(.2,.8,.2,1);
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  html{font-size:16px}
  body{
    font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:radial-gradient(ellipse 80% 50% at 50% 0%,#1a222e 0%,var(--bg) 60%);
    color:var(--text);min-height:100vh;line-height:1.5;overflow-x:hidden;
  }
  /* Header */
  header{
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:14px 20px;background:rgba(18,22,28,.95);border-bottom:1px solid var(--border);
    position:sticky;top:0;z-index:50;backdrop-filter:blur(8px);flex-wrap:wrap;
  }
  .logo{font-size:clamp(1.1rem,2.5vw,1.4rem);font-weight:800;letter-spacing:.5px;white-space:nowrap}
  .logo span{color:var(--gold)}
  .balance{
    display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--border);
    padding:8px 14px;border-radius:var(--radius-sm);flex-wrap:wrap
  }
  .balance b{color:var(--green);font-size:clamp(1rem,2vw,1.2rem);font-variant-numeric:tabular-nums}
  .bonus-btn{
    background:var(--gold);color:#0b0e12;border:0;padding:9px 14px;border-radius:var(--radius-sm);
    font-weight:700;font-size:.9rem;cursor:pointer;transition:background .15s,transform .05s;white-space:nowrap
  }
  .bonus-btn:hover:not(:disabled){background:#ffc04d}
  .bonus-btn:active:not(:disabled){transform:scale(.98)}
  .bonus-btn:disabled{background:#3a4452;color:#7a8797;cursor:not-allowed}
  /* Main */
  .wrap{max-width:1200px;margin:0 auto;padding:24px 16px}
  h2{font-size:1.1rem;margin-bottom:16px;color:#9fb0c3;font-weight:600}
  /* Cases grid */
  .cases{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
  .case{
    background:linear-gradient(160deg,#1e2632,#161c25);border:1px solid var(--border);
    border-radius:var(--radius);padding:16px;text-align:center;cursor:pointer;transition:var(--transition);
    position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center
  }
  .case:hover{border-color:var(--gold);transform:translateY(-4px);box-shadow:var(--shadow)}
  .case:disabled,.case.disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
  .case-img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:8px;margin-bottom:12px;background:#0f1319}
  .case h3{font-size:.95rem;margin-bottom:6px;font-weight:600;line-height:1.3}
  .case .price{color:var(--gold);font-weight:700;font-size:1.05rem}
  /* Inventory */
  .section{margin-top:40px}
  #inventory{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
  .inv{
    background:var(--panel);border:1px solid var(--border);border-left:3px solid #555;
    border-radius:var(--radius-sm);padding:12px;font-size:.85rem;display:flex;flex-direction:column;gap:6px;
    transition:var(--transition);position:relative
  }
  .inv:hover{border-color:#3a4452}
  .inv-img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;background:#0f1319}
  .inv-name{font-weight:500;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .inv-row{display:flex;justify-content:space-between;align-items:center;margin-top:auto}
  .inv-price{color:var(--gold);font-weight:700;font-size:.9rem}
  .sell-btn{
    background:transparent;border:1px solid var(--border);color:#9fb0c3;padding:6px 10px;
    border-radius:6px;font-size:.75rem;font-weight:600;cursor:pointer;transition:var(--transition);white-space:nowrap
  }
  .sell-btn:hover{border-color:var(--gold);color:var(--gold);background:rgba(245,166,35,.08)}
  .sell-btn:active{transform:scale(.96)}
  .sell-btn.selling{background:var(--gold);color:#0b0e12;border-color:var(--gold);cursor:wait}
  .empty{grid-column:1/-1;text-align:center;color:#6b7a8c;padding:40px 20px;font-size:.9rem}
  /* Roulette overlay */
  .overlay{
    position:fixed;inset:0;background:rgba(8,11,15,.92);display:none;align-items:center;justify-content:center;
    z-index:100;backdrop-filter:blur(6px);padding:20px;overflow-y:auto
  }
  .overlay.show{display:flex}
  .reel-box{
    width:min(820px,96vw);background:var(--panel);border:1px solid var(--border);border-radius:16px;
    padding:24px;text-align:center;box-shadow:var(--shadow);animation:popIn .3s var(--transition)
  }
  @keyframes popIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
  .reel-box h3{font-size:1rem;margin-bottom:18px;color:#9fb0c3;font-weight:600}
  .reel{
    position:relative;height:140px;overflow:hidden;border:1px solid var(--border);
    border-radius:10px;background:#0f1319;
    mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)
  }
  .strip{display:flex;height:100%;will-change:transform;touch-action:none}
  .sitem{
    flex:0 0 140px;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:6px;border-right:1px solid #1d242e;font-size:.75rem;color:#b9c4d1;padding:8px 6px;text-align:center;
    background:linear-gradient(180deg,rgba(255,255,255,.02),transparent)
  }
  .sitem:last-child{border-right:none}
  .sitem-img{width:70px;height:70px;object-fit:cover;border-radius:6px;background:#1a212b;filter:drop-shadow(0 2px 6px rgba(0,0,0,.5))}
  .sitem-name{font-size:.7rem;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .pointer{
    position:absolute;left:50%;top:0;bottom:0;width:3px;background:var(--gold);
    transform:translateX(-50%);box-shadow:0 0 14px var(--gold),0 0 28px var(--gold);z-index:5;
    pointer-events:none
  }
  .pointer::before,.pointer::after{
    content:'';position:absolute;left:50%;width:0;height:0;border:6px solid transparent;
    border-bottom-color:var(--gold);transform:translateX(-50%);filter:drop-shadow(0 0 4px var(--gold))
  }
  .pointer::before{top:-6px}.pointer::after{bottom:-6px;border-top-color:var(--gold);border-bottom-color:transparent}
  .result{margin-top:18px;min-height:28px;font-size:.95rem;line-height:1.4}
  .result b{font-weight:700}
  .close-btn{
    margin-top:16px;background:var(--border);color:var(--text);border:0;padding:12px 28px;
    border-radius:var(--radius-sm);cursor:pointer;font-size:.9rem;font-weight:600;transition:var(--transition);min-width:140px
  }
  .close-btn:hover:not(:disabled){background:#3a4452}
  .close-btn:disabled{opacity:.4;cursor:wait}
  /* Toast */
  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);
    background:var(--panel);color:var(--text);padding:12px 22px;border-radius:var(--radius-sm);
    font-size:.9rem;opacity:0;transition:var(--transition);z-index:200;pointer-events:none;
    border:1px solid var(--border);box-shadow:var(--shadow);white-space:nowrap
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  /* Footer */
  footer{text-align:center;color:#5a6675;font-size:.75rem;padding:30px 20px;line-height:1.6}
  /* Fair badge */
  .fair-badge{display:inline-flex;align-items:center;gap:6px;font-size:.7rem;color:#7a8797;margin-top:8px;padding:4px 8px;background:rgba(245,166,35,.1);border:1px solid rgba(245,166,35,.2);border-radius:20px}
  .fair-badge svg{width:14px;height:14px;color:var(--gold);flex-shrink:0}
  /* Responsive */
  @media (max-width:520px){
    header{gap:10px;padding:12px 16px}
    .balance{gap:8px;padding:6px 10px}
    .bonus-btn{padding:7px 10px;font-size:.8rem}
    .reel-box{padding:18px}
    .sitem{flex:0 0 120px}
    .sitem-img{width:56px;height:56px}
  }
</style>
</head>
<body>

<header>
  <div class="logo">CS2 <span>CASE FARM</span></div>
  <div class="balance">
    <span>Баланс: <b id="balance">0</b> ₽</span>
    <button class="bonus-btn" id="bonusBtn" aria-label="Получить бонус">+100 ₽</button>
  </div>
</header>

<div class="wrap">
  <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:16px">
    <h2>Кейсы</h2>

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="4"/><path d="M12 8v8M12 16h.01"/></svg>
      Provably Fair
    </div>
  </div>
  <div class="cases" id="cases" role="list" aria-label="Список кейсов"></div>

  <div class="section">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:16px">
      <h2>Инвентарь</h2>
      <button class="bonus-btn" id="sellAllBtn" style="padding:6px 12px;font-size:.8rem;background:#2a323d;color:var(--text)" onclick="sellAll()">Продать всё</button>
    </div>
    <div id="inventory" role="list" aria-label="Ваш инвентарь"></div>
  </div>
</div>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="reelTitle">
  <div class="reel-box">
    <h3 id="reelTitle">Открытие кейса</h3>
    <div class="reel" aria-hidden="true">
      <div class="strip" id="strip"></div>
      <div class="pointer" aria-hidden="true"></div>
    </div>
    <div class="result" id="result" aria-live="polite"></div>
    <button class="close-btn" id="closeBtn" disabled>Закрыть</button>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<footer>
  Демонстрационный проект. Баланс выдаётся бесплатно, вывод средств невозможен.<br>
  Не является азартной игрой. 18+
</footer>

const RARITY = {
  common:    { color: '#8a95a3', label: 'Обычный' },
  uncommon:  { color: '#5b8dd6', label: 'Необычный' },
  rare:      { color: '#4a6fe0', label: 'Редкий' },
  mythic:    { color: '#8a5bd6', label: 'Мифический' },
  legendary: { color: '#d64a8a', label: 'Легендарный' },
  ancient:   { color: '#f5a623', label: 'Древний' }

/* ===================== СОСТОЯНИЕ ===================== */
const KEY_BAL = 'cs2_balance_v2';
const KEY_INV = 'cs2_inv_v2';
const KEY_BONUS = 'cs2_bonus_v2';
const KEY_FAIR = 'cs2_fair_v2'; // {serverSeedHash, clientSeed, nonce}

let balance = Number(localStorage.getItem(KEY_BAL) ?? 1000);
let inventory = JSON.parse(localStorage.getItem(KEY_INV) || '[]');
let fairState = JSON.parse(localStorage.getItem(KEY_FAIR) || '{}');

function saveState() {
  localStorage.setItem(KEY_BAL, balance);
  localStorage.setItem(KEY_INV, JSON.stringify(inventory));
  localStorage.setItem(KEY_FAIR, JSON.stringify(fairState));
  renderBalance();
  renderInventory();
}

/* ===================== DOM ХЕЛПЕРЫ ===================== */
const $ = id => document.getElementById(id);
let toastTimer;
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}
function renderBalance() { $('balance').textContent = balance.toLocaleString('ru-RU'); }

function renderCases() {
  $('cases').innerHTML = CASES.map(c => `
    <article class="case" data-id="${c.id}" role="listitem" tabindex="0" aria-label="${c.name}, цена ${c.price} ₽">
      <img class="case-img" src="${c.img}" alt="${c.name}" loading="lazy" decoding="async" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 330 192%22%3E%3Crect fill=%22%231a212b%22 width=%22330%22 height=%22192%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 fill=%22%234a5568%22 font-size=%2214%22%3E${c.name}%3C/text%3E%3C/svg%3E'">
      <h3>${c.name}</h3>
      <div class="price">${c.price} ₽</div>
    </article>`).join('');

  document.querySelectorAll('.case').forEach(el => {
    const c = CASES.find(x => x.id === el.dataset.id);
    el.onclick = () => openCase(c);
    el.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openCase(c); } };
    if (balance < c.price) el.classList.add('disabled');
  });
}

function renderInventory() {
  const box = $('inventory');
  if (!inventory.length) { box.innerHTML = '<div class="empty">Пока пусто — откройте первый кейс.</div>'; return; }
  box.innerHTML = inventory.slice().reverse().map((it, idx) => {
    const r = RARITY[it.rarity] || RARITY.common;
    const realIdx = inventory.length - 1 - idx;
    return `<article class="inv" style="border-left-color:${r.color}" data-idx="${realIdx}" role="listitem">
      <img class="inv-img" src="${it.img}" alt="${it.name}" loading="lazy" decoding="async" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 200 200%22%3E%3Crect fill=%22%231a212b%22 width=%22200%22 height=%22200%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 fill=%22%234a5568%22 font-size=%2212%22%3E${it.name}%3C/text%3E%3C/svg%3E'">
      <div class="inv-name">${it.name}</div>
      <div class="inv-row">
        <span class="inv-price">${it.price} ₽</span>
        <button class="sell-btn" onclick="sellItem(${realIdx})" aria-label="Продать ${it.name} за ${it.price} ₽">Продать</button>
      </div>
    </article>`;
  }).join('');
}

/* ===================== БОНУС ===================== */
function updateBonusBtn() {
  const btn = $('bonusBtn');
  const last = Number(localStorage.getItem(KEY_BONUS) || 0);
  const left = 60000 - (Date.now() - last);
  if (left <= 0) { btn.disabled = false; btn.textContent = '+100 ₽'; }
  else { btn.disabled = true; btn.textContent = `через ${Math.ceil(left / 1000)} с`; }
}
$('bonusBtn').onclick = () => {
  balance += 100; localStorage.setItem(KEY_BONUS, Date.now()); saveState(); updateBonusBtn(); toast('+100 ₽ начислено');
};
setInterval(updateBonusBtn, 1000);

/* ===================== PROVABLY FAIR (Web Crypto) ===================== */
async function genServerSeed() {
  const buf = crypto.getRandomValues(new Uint8Array(32));
  const seed = Array.from(buf).map(b => b.toString(16).padStart(2, '0')).join('');
  const hashBuf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(seed));
  const hash = Array.from(new Uint8Array(hashBuf)).map(b => b.toString(16).padStart(2, '0')).join('');
  return { seed, hash };
}
async function rollFair(serverSeed, clientSeed, nonce, items) {
  const msg = `${clientSeed}:${nonce}`;
  const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(serverSeed), { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
  const sig = await crypto.subtle.sign('HMAC', key, new TextEncoder().encode(msg));
  const bytes = new Uint8Array(sig);
  let n = 0n; for (let i = 0; i < 8; i++) n = (n << 8n) | BigInt(bytes[i]);
  const roll = Number(n) / 2 ** 64;
  let acc = 0;
  for (let i = 0; i < items.length; i++) { acc += items[i].weight; if (roll < acc) return { index: i, roll }; }
  return { index: items.length - 1, roll };
}
async function verifyRoll(serverSeed, clientSeed, nonce, items, expectedIndex) {
  const { index } = await rollFair(serverSeed, clientSeed, nonce, items);
  return index === expectedIndex;
}

/* ===================== ОТКРЫТИЕ КЕЙСА ===================== */
let animating = false;
async function openCase(caseData) {
  if (animating) return;
  if (balance < caseData.price) { toast('Недостаточно баланса'); return; }

  // 1. Списываем баланс
  balance -= caseData.price;
  saveState();

  // 2. Подготавливаем provably fair
  const { seed: serverSeed, hash: serverSeedHash } = await genServerSeed();
  const clientSeed = `cf-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
  const nonce = Date.now();

  // Веса для ролла (обратная зависимость от цены)
  const itemsWithWeight = caseData.items.map(it => ({ ...it, weight: 1 / Math.pow(it.price + 50, 0.9) }));
  const { index: winIndex, roll } = await rollFair(serverSeed, clientSeed, nonce, itemsWithWeight);
  const winItem = caseData.items[winIndex];

  // 3. Сохраняем fair-данные для верификации
  fairState = { serverSeed, serverSeedHash, clientSeed, nonce, roll, caseId: caseData.id, winIndex };
  localStorage.setItem(KEY_FAIR, JSON.stringify(fairState));

  // 4. Строим ленту (50 слотов, выигрыш в центре)
  const COUNT = 50;
  const WIN_POS = 44; // индекс в ленте, где остановится указатель
  const STEP = 140;   // ширина .sitem
  const reelEl = $('strip');
  const reelWrap = reelEl.parentElement;
  const reelW = reelWrap.clientWidth;

  const stripItems = [];
  for (let i = 0; i < COUNT; i++) {
    stripItems.push(i === WIN_POS ? winItem : caseData.items[Math.floor(Math.random() * caseData.items.length)]);
  }

  reelEl.innerHTML = stripItems.map(it => {
    const r = RARITY[it.rarity] || RARITY.common;
    return `<div class="sitem" style="box-shadow:inset 0 -4px 0 ${r.color}">
      <img class="sitem-img" src="${it.img}" alt="${it.name}" loading="lazy" decoding="async" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 200 200%22%3E%3Crect fill=%22%231a212b%22 width=%22200%22 height=%22200%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 fill=%22%234a5568%22 font-size=%2212%22%3E${it.name}%3C/text%3E%3C/svg%3E'">
      <div class="sitem-name">${it.name}</div>
    </div>`;
  }).join('');

  // 5. Анимация
  animating = true;
  $('result').innerHTML = '';
  $('reelTitle').textContent = caseData.name;
  $('closeBtn').disabled = true;
  $('overlay').classList.add('show');

  // Сброс позиции
  reelEl.style.transition = 'none';
  reelEl.style.transform = 'translateX(0)';
  await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

  // Цель с небольшим джиттером для натуральности
  const jitter = (Math.random() - 0.5) * (STEP * 0.5);
  const targetX = -(WIN_POS * STEP + STEP / 2 - reelW / 2) + jitter;

  reelEl.style.transition = 'transform 4.2s cubic-bezier(0.12, 0.75, 0.25, 1)';
  reelEl.style.transform = `translateX(${targetX}px)`;

  // 6. Финал
  setTimeout(() => {
    const r = RARITY[winItem.rarity] || RARITY.common;
    $('result').innerHTML = `Вы получили: <b style="color:${r.color}">${winItem.name}</b> — ${winItem.price} ₽`;
    inventory.push({ ...winItem, id: Date.now() + Math.random() });
    saveState();
    $('closeBtn').disabled = false;
    animating = false;
    // Конфетти для дорогих
    if (winItem.price >= 500) burstConfetti(r.color);
  }, 4300);
}

$('closeBtn').onclick = () => $('overlay').classList.remove('show');
$('overlay').onclick = e => { if (e.target === $('overlay')) $('overlay').classList.remove('show'); };

/* ===================== ПРОДАЖА ===================== */
function sellItem(idx) {
  if (idx < 0 || idx >= inventory.length) return;
  const btn = document.querySelector(`.inv[data-idx="${idx}"] .sell-btn`);
  if (!btn || btn.classList.contains('selling')) return;
  btn.classList.add('selling'); btn.textContent = 'Продажа…';
  // Небольшая задержка для UX
  setTimeout(() => {
    const item = inventory[idx];
    balance += item.price;
    inventory.splice(idx, 1);
    saveState();
    toast(`Продано: ${item.name} за ${item.price} ₽`);
  }, 300);
}
function sellAll() {
  if (!inventory.length) { toast('Инвентарь пуст'); return; }
  const total = inventory.reduce((s, it) => s + it.price, 0);
  balance += total;
  inventory = [];
  saveState();
  toast(`Продано всего предметов: ${inventory.length + 1} на ${total} ₽`);
}

/* ===================== КОНФЕТТИ (CSS-only, нет canvas) ===================== */
function burstConfetti(color) {
  const container = document.createElement('div');
  container.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:150;overflow:hidden';
  document.body.appendChild(container);
  for (let i = 0; i < 30; i++) {
    const p = document.createElement('div');
    const size = Math.random() * 8 + 6;
    const left = Math.random() * 100;
    const dur = Math.random() * 1.5 + 1.5;
    const delay = Math.random() * 0.5;
    p.style.cssText = `
      position:absolute;left:${left}%;top:-20px;width:${size}px;height:${size}px;background:${color};
      border-radius:${Math.random() > .5 ? '50%' : '2px'};opacity:0;
      animation:confettiFall ${dur}s ${delay}s ease-out forwards;
      transform:rotate(${Math.random() * 360}deg);
    `;
    container.appendChild(p);
  }
  setTimeout(() => container.remove(), 3500);
}
// Добавляем ключевые кадры один раз
const styleSheet = document.createElement('style');
styleSheet.textContent = `
@keyframes confettiFall {
  0% { opacity:1; transform:translateY(0) rotate(0); }
  100% { opacity:0; transform:translateY(120vh) rotate(720deg); }
}`;
document.head.appendChild(styleSheet);

/* ===================== СТАРТ ===================== */
renderCases();
renderBalance();
renderInventory();
updateBonusBtn();
</script>
